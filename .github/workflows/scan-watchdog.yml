name: Scan watchdog

# Every 30 minutes, asks the deployed app to check whether each user's daily
# scan has run, and to run it as a backup if it is overdue or died. This lives
# here rather than in vercel.json because Vercel's Hobby plan only allows
# cron jobs that run once a day.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DOCKET_SITE_URL  the production URL, e.g. https://your-app.vercel.app
#   CRON_SECRET      the same value as the CRON_SECRET Vercel environment variable
#
# The job fails (and GitHub emails the workflow's owner) if the app can't be
# reached or reports a scan failure, so a broken watchdog is not silent either.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call the scan watchdog
        env:
          SITE_URL: ${{ secrets.DOCKET_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Add the DOCKET_SITE_URL and CRON_SECRET repository secrets (see the comments at the top of this workflow)."
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 330 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/scan-watchdog"
          echo
